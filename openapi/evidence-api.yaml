openapi: 3.0.3
info:
  title: ARGOS Evidence API
  version: "1.0.0"
  description: >-
    Consulta de metadatos de evidencia (EvidenceManifest v1), nunca el
    contenido del artefacto. Solo lectura: la evidencia ya escrita no es
    modificable por ningún cliente de esta API, incluido el agente
    (ADR-006/ADR-016). SmartOps nunca escribe evidencia — eso es exclusivo
    de argos-core/services/evidence_writer.
servers:
  - url: "https://TODO.argos.internal/evidence-api/v1"
paths:
  /evidence/{artifact_id}:
    get:
      summary: Obtener metadatos de un artefacto de evidencia (no el contenido)
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            Metadatos del artefacto (sha256, object_ref, retention). El
            contenido real se obtiene resolviendo object_ref contra Ceph RGW,
            no desde esta API.
          content:
            application/json:
              schema:
                type: object
                required: [artifact_id, media_type, object_ref, sha256, created_at, retention]
                properties:
                  artifact_id:
                    type: string
                  media_type:
                    type: string
                  object_ref:
                    type: string
                  sha256:
                    type: string
                    pattern: "^[a-f0-9]{64}$"
                  created_at:
                    type: string
                    format: date-time
                  retention:
                    type: object
        "404":
          description: No encontrado
