# No usa reusable-python-ci.yaml de argos-control: ese workflow asume un
# paquete Python real (ruff, mypy, pytest --cov, pyproject.toml). Este
# repositorio es datos/schemas, no un servicio — su propia validación
# (scripts/validate.sh + scripts/test.sh) ya cubre lo que importa.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyyaml jsonschema referencing
      - run: ./scripts/validate.sh
      - run: ./scripts/test.sh
